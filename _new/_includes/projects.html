<section class="projects fade-in">
    <h2>Current Projects</h2>
    <div class="projects-grid">
        {% for project in site.data.projects %}
        <div class="project-card fade-in--delay-{{ forloop.index }}">
            <div class="project-header">
                <h3>{{ project.title }}</h3>
                <span class="project-year">{{ project.year }}</span>
            </div>
            <p class="project-description">{{ project.description }}</p>
            <div class="project-footer">
                <span class="project-status {% if project.status == 'Active' %}status-active{% else %}status-completed{% endif %}">
                    {{ project.status }}
                </span>
                {% if project.link %}
                <a href="{{ project.link }}" class="project-link">Learn More →</a>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</section>
