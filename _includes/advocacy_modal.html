<!-- Advocacy Modal -->
<div class="advocacy-modal" role="dialog" aria-modal="true">
    <button class="modal-close" aria-label="Close advocacy">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
    
    <div class="modal-container">
        <!-- Fixed header container -->
        <div class="modal-header-container"></div>
        
        <!-- Scrollable content container -->
        <div class="modal-content">
            <iframe class="pdf-viewer" frameborder="0"></iframe>
        </div>

        <!-- Fixed footer container -->
        <div class="modal-footer-container"></div>
    </div>
</div>
