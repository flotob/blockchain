<!-- Slideshow Modal -->
<div class="slideshow-modal" role="dialog" aria-modal="true">
    <button class="modal-close" aria-label="Close slideshow">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
    
    <div class="modal-container">
        <div class="modal-content">
            <!-- Dynamic content container -->
            <div class="slide-content"></div>
            
            <!-- Navigation -->
            <div class="modal-navigation">
                <button class="nav-button prev" aria-label="Previous slide">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                
                <div class="slide-indicators" role="tablist"></div>
                
                <button class="nav-button next" aria-label="Next slide">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>
