---
layout: default
---

<div class="max-w-4xl mx-auto">
    <!-- Page Header -->
    <header class="mb-8">
        {% if page.title %}
        <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-4">{{ page.title }}</h1>
        {% endif %}
        
        {% if page.subtitle %}
        <p class="text-xl text-gray-600 dark:text-gray-400">{{ page.subtitle }}</p>
        {% endif %}
    </header>

    <!-- Page Content -->
    <div class="prose dark:prose-invert prose-primary max-w-none">
        {{ content }}
    </div>

    {% if page.cta %}
    <!-- Call to Action -->
    <div class="mt-12 bg-gray-50 dark:bg-gray-800 rounded-2xl p-8 text-center">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">{{ page.cta.title }}</h2>
        <p class="text-xl text-gray-600 dark:text-gray-400 mb-8">{{ page.cta.description }}</p>
        <a href="{{ page.cta.button_url }}" class="btn-primary">{{ page.cta.button_text }}</a>
    </div>
    {% endif %}
</div>
