---
layout: base
meta: seo
---

<style>
  .pdf {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }
  .pdf-container {
    width: 100%;
    height: 800px;
    margin: 20px 0;
  }
  .pdf-container iframe {
    border: 1px solid #ddd;
  }
  .metadata {
    margin-top: 20px;
    padding: 20px;
    background: #f5f5f5;
  }
  .metadata p {
    margin: 5px 0;
  }
  .tags span {
    display: inline-block;
    background: #eee;
    padding: 2px 8px;
    margin: 2px;
  }
</style>

<main class="pdf">
  <div class="pdf-container">
    <iframe src="{{ page.pdf_url }}" width="100%" height="100%"></iframe>
  </div>
  <div class="metadata">
    <p><strong>Title:</strong> {{ page.title }}</p>
    <p><strong>Organization:</strong> {{ page.organization }}</p>
    <p><strong>Type:</strong> {{ page.type }}</p>
    <p><strong>Date:</strong> {{ page.date }}</p>
    <p><strong>Language:</strong> {{ page.language }}</p>
    <p><strong>Pages:</strong> {{ page.total_pages }}</p>
    <p class="tags">
      <strong>Tags:</strong> 
      {% for tag in page.tags %}
        <span>{{ tag }}</span>
      {% endfor %}
    </p>
  </div>
</main>
