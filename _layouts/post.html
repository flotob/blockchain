---
layout: base
meta: seo
---
<!-- Debug: {{ page.meta }} -->
<main class="post">
  <article>
    <header>
      <h1>{{ page.title }}</h1>
      <div class="meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%B %d, %Y" }}
        </time>
        {% if page.categories %}
        <span class="categories">
          {% for category in page.categories %}
          <a href="/{{ category }}">{{ category | capitalize }}</a>
          {% endfor %}
        </span>
        {% endif %}
      </div>
    </header>

    {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title }}" class="featured-image">
    {% endif %}

    <div class="content">
      {{ content }}
    </div>

    <footer>
      <div class="share">
        <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener">Share on Twitter</a>
        <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ site.url }}{{ page.url }}&title={{ page.title | url_encode }}" target="_blank" rel="noopener">Share on LinkedIn</a>
      </div>
    </footer>
  </article>
</main>
