          - title: Trailer Berlin Legal Tech 2018
            description: |-
              In February 2018, we gathered 100+ legal hackers at our two-day hackathon during the second edition of Berlin Legal Tech. Developers, UX designers and legal professionals worked on legal tech solutions for the future of legal services.

              On the third day of Berlin Legal Tech 2018, we held a conference that brought together legal tech enthusiasts and renowned speakers to discuss how the digital revolution will affect law and legal practice in the near and far future.

              Sign up for Berlin Legal Tech 2019 here: berlinlegal.tech/2019
