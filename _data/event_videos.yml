    years:
      - year: 2017
        videos:
          - title: 'Berlin Legal Tech 2017: Conference Trailer (German)'
            description: |-
              Vom 8. bis 10. Februar fand die Berlin Legal Tech 2017 statt. Das einzigartige Event im Legal Tech Bereich entstand unter der Leitung von Legal-Tech Pionier Prof. Stephan Breidenbach, Europa-Universität Viadrina, und des auf Blockchain-Technologie spezialisierten Rechtsanwalts und Unternehmers Florian Glatz.
               
              Die dreitägige Veranstaltung begann mit einem Hackathon, auf dem Juristen und Softwareentwickler gemeinsam Themen identifizierten und Lösungen entwickelten. Begleitet durch Legal Knowledge Engineers, Juristen mit technischer Expertise, wurden Ideen in einem offenen Format entwickelt, Teams interessengeleitet gebildet und sodann in einem freundschaftlichen Wettbewerb gepitcht. Die überzeugendsten Konzepte und wegweisendsten Prototypen wurden von einer Experten-Jury prämiert.
               
              Die darauf folgende Konferenz fand am 10. Februar statt. Renommierte Speaker hatten die Gelegenheit, sich in einem offenen Dialog mit der Digitalisierung der Rechtswirklichkeit auseinanderzusetzen. In interaktiven Breakout Sessions wurden Fragen und Themen zu Blockchain, Künstlicher Intelligenz und der Industrialisierung von Rechtsdienstleistungen beantwortet. Auch präsentierten die Sieger des Hackathons ihre Ideen und Produkte.
