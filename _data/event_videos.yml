        videos:
          - title: The Reg3 Conference - The 2023 Roundtables
            description: |-
              Crypto conferences abound. Even on regulation. Surprisingly, they can sometimes be entertaining. But there’s something missing: sufficient space and time to connect.

              So, in this second year, Reg3 turned the idea of a conference upside down. While still not a summit or a forum, we transformed this edition into a more intimate and quite relaxed event, focused on open-door roundtables where observers are welcome.

              Did you ask for less structured content and deeper interactions?

              Learn more about how we're promoting better regulation for decentralised technology at reg3.eu
