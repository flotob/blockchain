projects:
  - title: Common Ground
    role: Co-Founder & Board Member
    description: Co-Founder and board member of the Common Ground Association, developing a user-owned social network using web3 primitives
    description_mobile: Building a user-owned social network with web3 technology
    image: https://framerusercontent.com/images/hYVNYcaQlCxkrdC7IfgIhm8ri0.png
    url: https://commonground.cg
    image_type: default
    slides:
      - type: text
        title: Our Vision
        content: At Common Ground, we envision a future where digital communities are owned and governed by their members, fostering transparency, inclusivity, and collaboration through cutting-edge web3 technology.

      - type: bullet
        title: Platform Capabilities
        items:
          - "**Decentralized Governance**: Empowering users with decision-making authority."
          - "**On-Chain Identity**: Seamless integration of web3 identities for secure interactions."
          - "**Token Gating**: Exclusive access to content and features through token ownership."
          - "**Real-Time Communication**: Chats, video calls, and live broadcasts to connect communities."
          - "**Community Wallets**: Shared treasuries for collective growth and investment."

      - type: image
        url: https://via.placeholder.com/800x450.png?text=Product+Screenshot+1
        title: User Dashboard
        caption: User Dashboard
        description: A glimpse into our intuitive user interface designed for seamless navigation.

      - type: image
        url: https://via.placeholder.com/800x450.png?text=Product+Screenshot+2
        title: Community Engagement Tools
        caption: Community Engagement Tools
        description: Tools that facilitate vibrant and interactive community experiences.

      - type: text
        title: Innovative Co-Ownership Model
        content: Common Ground is built as a user-owned cooperative, ensuring that the platform's value is shared among its community members. Our funding strategy emphasizes collective ownership, aligning incentives, and fostering a sense of belonging and responsibility among users.

      - type: stats
        title: Platform Growth
        stats:
          - label: Active Users
            value: 50,000+
          - label: Communities Created
            value: 1,200+
          - label: Daily Transactions
            value: 15,000+
          - label: Tokens Distributed
            value: 2 Million+

      - type: text
        title: Join the Movement
        content: Be part of the revolution in digital community building. Experience the future of social interaction with Common Ground.

