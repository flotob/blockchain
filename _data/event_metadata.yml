events:
  - title: "Berlin Legal Tech"
    description: "A groundbreaking annual series that featured Europe's first legal tech hackathon and conference, attracting over 1,650 participants from 30 countries. Across its editions, the event hosted more than 130 lectures and 80 project pitches, bringing together lawyers, developers, and legal engineers to create innovative solutions and compete for prizes."
  - title: "Swiss Legal Tech"
    description: "An annual series of hackathons and conferences based in Zurich, inspired by the Berlin Legal Tech model, tailored to Switzerland's legal and financial sectors."
  - title: "Legal Tech Summer School"
    description: "A free, annual educational program designed for students, combining hands-on workshops, expert-led sessions, and collaborative projects to explore the intersection of law and technology."
  - title: "The Reg3 Conference"
    description: "An ongoing annual conference series that brings policymakers and developers together to address challenges such as decentralized governance, compliance, and blockchain regulation." 