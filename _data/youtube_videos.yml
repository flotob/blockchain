    - title: '#37 Overview of MiCAR | Marina Markezic, Simon Polrot & Florian Glatz from EUCI | Chainist Meetup'
      description: |-
        This is the recording of our 37th meetup which took place on 4 May 2021.

        -----

        Summer 2020 was dubbed the 'Defi Summer'. The hype around crypto projects such as MakerDAO, Uniswap, Compound, Aave, Sushi etc. exploded immensely after our first meetup on the topic. Coinscident? Who knows? ;)

        One thing is clear: laws and regulations are coming. Especially, the European Commissions Proposal for a Regulation on Markets in Crypto-assets (MiCAR). This European legislation will impact EU based crypto projects.

        How?

        In a lot of different ways:

        It will establish rules for: The issuance and initial sale of tokens. The content of a projects Whitepapers. The issuance of asset-referenced tokens. It will introduce and regulate e-money tokens. There will also be a regulation of 'insider trading' that projects will have to comply with, just like in the stock markets. And a lot more.

        And because of all that paper stuff coming our way, we are glad to have our very special guests for this meetup: The team of the European Crypto Initiative (EUCI). Marina Markezic, Simon Polrot and Florian Glatz are the experts in questions on crypto regulation. And for questions on what such regulation means for projects, devs, users, token holders etc.

        The EUCI team is currently on a mission to make sure that Europe doesn't miss out on the oppertunity to build and join a global, more transparent, secure, natively digital, financial market. They are working to improve the proposed crypto regulation, engage members of the European Parliament, the European Commission and the European Council to share and defend their positions. They also work with other initiatives and industry bodies to amplify shared positions and gain support from lawmakers and the broader private sector.

        In this meetup Marina, Simon and Florian give an overview of the current proposal for crypto regulation in the EU and we will have a chance to discuss crypto regulation and how it could or should be done!

        If you would like to support the team and their efforts check out https://euci.io!

        Timestamps:
        00:00 Introduction
        03:41 Presentation by EUCI
        58:20 Discussion

