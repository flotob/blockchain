    - title: Incentive Design x Policy Workshop (Radicle x BlueYard)
      description: |-
        This is the recording of the lightening talks and Q&A round from the Incentive Design x Policy Workshop hosted on July 6th, 2022 in Berlin.

        Reason behind the workshop:
        One reason why we think there is not more concrete legislation on our 'sandbox' of play in web3 is due to a lack of aligned incentives. In web3, protocols are good at customizing templatized models to incentivize their communities in certain ways, but there are gaps in this approach. BlueYard and radicle were excited to be bringing together a mix of advocates, policy makers, academics and protocol builders to share their perspectives and innovate on the future of collaboration between policy and crypto. 

        What We Hoped to Accomplish:
        - Understand the overlap between the goals of web3 and that of regulation enforcers 
        - Provide insight into existing and historical incentive models that have aligned interests across various stakeholder groups + innovate on new ones

        A special thank you to our speakers:
        - Trent McConaghy (Ocean Protocol)
        - Dr. Friederike Ernst (Gnosis)
        - Florian Glatz (European Crypto Initiative)
