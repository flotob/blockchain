    - title: 'Blockchain in Use conference 2021: Public Administration Track'
      description: |-
        The Blockchain in Use conference 2021 Public Admin session featured as speakers:
        Michael Kolain, Deutsches Forschungsinstitut für öffentliche Verwaltung, Matthias L. Jugel, Ubirch, Tillmann Heiss, KfW, Matti Große, ITDZ, Franziska Köhler (BAMF), Florian Glatz (Bundesblock).

        Berlin has been coined as the “Blockchain capital of the world” many times. There is no doubt that the blockchain community is among the most in the world. But how can the city itself and the public administration capitalize on the potential of the technology and which are the most promising areas of application? 

        We have invited a set of experts in the area to share their opinion and experiences in Public Administration and blockchain integration  in a 1.5-hour discussion.

        The session host is Shoshana Schnipenkoetter, Innovation Manager at Berlin Partner for Business and Technology

        Blockchain in Use Conference

        After the success of Blockchain in Use 2020, this year Blockchain in Use 2021 is back with new tracks.

        BerChain e.V teamed up once more with Berlin Partner for Business and Technology  to bring to you Blockchain in Use 2021, a 5-day online event series exploring the ‘Blockchain-in-use’ across several industries with five new verticals around the latest blockchain real-world applications that are already implemented or close to being implemented. 

        Visit the conference website here for more info:

        https://berchain.com/blockchain-in-use-conference-2021/
