    - title: 'Pt 2. Unfiltered Insights: The State of Crypto'
      description: |-
        In this episode, we dive deep into an insightful conversation with Florian, a seasoned lawyer in the crypto space with a unique perspective on its evolution and challenges. Florian reflects on his journey from legal advocacy and public speaking to becoming an opinion leader on Twitter through authentic and controversial shitposting. He shares his thoughts on the current state of the crypto industry, the need for genuine app development, and the crucial role of truthful communication in media. The discussion also explores broader societal issues like social media influence, political shifts, and the impact of misinformation. Join us for an eye-opening dialogue about the future direction of cryptocurrency and its potential to effect meaningful change.

