    - title: 'Regulating the Unregulated: Response Strategies for the Upcoming DeFi Regulationsn - Marina Markezic'
      description: |-
        For the first time in history, the regulators are coming up with a regulation for decentralised entities, specifically decentralised finance. Next year, we expect DeFi regulatory proposals from major crypto markets (EU and USA) and international organisations (IOSCO, Bank of International Settlements). Those proposals will significantly impact how the DeFi products will be built, designed and offered on the market. In this talk, we will briefly update you on the current regulatory situation and propose response strategies for the community to adopt. Besides education and sharing best use cases and practices, it is essential to showcase the unique contribution DeFi and decentralised use cases can provide to the more considerable societal challenges.

        Marina Markezic
        Founders
        European Crypto Initiative
        Marina is the co-founder and the executive director of EUCI, which aims to propel EU regulation to become Defi-friendly. Since 2017 Marina has been advising crypto projects on governance and legal matters with a focus on decentralization, DeFi and NFTs. She previously led the advisory team of a blockchain accelerator and co-founded a crowdinvesting platform. Florian Glatz is Vice President of the European Crypto Initiative (EUCI) and co-founder of Common Ground (commonground.cg), a novel social network built for web3 communities and DAOs. A visionary at heart, Florian paves the way for self-sovereign identities, community-led decision-making and a user-owned data economy. Trained as a lawyer and software developer, Florian is an expert on key issues at the intersection of crypto assets and regulation. Full-time in the industry since 2014, Florian has co-founded and led the German Blockchain Association (Bundesblock) as President before expanding his influence into the European crypto policy sphere. Within EUCI, Florian advocates for the importance of decentralized projects and financial privacy in the context of the MiCA and AML regulations. As a major result, the EU dropped the term "unhosted wallets" in favour of "self-custodial wallets" and has allowed DeFi, NFTs and other foundational innovations to stay exempt from immediate regulation, giving the nascent ecosystem a chance to innovate. Florian is the publisher of the print magazine REthinking Law, and books on Legal Tech and Blockchain. Florian loves sharing his passion for crypto with others and over time has motivated many people to join the revolution. In his free time, he enjoys contemplating metaphysics and consciousness.
