    - title: Crypto enthusiasts seek Bitcoin alternatives
      description: "(19 Feb 2018) LEADIN:\r\nDespite recent fluctuations, crypto currency Bitcoin has become known to the mass market and increased dramatically in value from where it started.\r\nBut with fame comes problems. The relatively slow transaction time and high fees mean some crypto enthusiasts are now looking beyond Bitcoin.\r\nSTORYLINE:\r\nThis cafe in Wedding - one of Berlin's hippest districts - might look like any other trendy coffee shop in Europe.\r\nBut, it's also one of dozens of restaurants and cafes in Berlin, often called \"the capital of Bitcoin\", which accept cryptocurrencies as payment.\r\nHere at the Mirage Bistrot - which fuses Italian coffee with French food - customers can pay in Bitcoin, but also in Litecoins or Ether, two other cryptocurrencies based on Blockchain technology.\r\nMost still pay with euros, of course. But, the option is there.\r\nFlorian Glatz, the president of the German Blockchain Association and a \"Blockchain lawyer\", can whip out his smartphone, open a cryptocurrency app and make a payment.\r\n\"We are a new cafe and we want to be a part of the trends that are happening. We believe in the future and we want to be innovative,\" says Jochen Kuepper, the owner of the cafe.\r\nWhile paying for a coffee with Bitcoin might sound futuristic to some, it's already falling out of favour with some cryptocurrency enthusiasts.\r\nThe number of transactions on the Blockchain - the universal ledger where all Bitcoin transactions are processed - are limited.\r\nAs Bitcoin has become more popular, the number of transactions requested has gone up exponentially. This resulted in a lag and higher fees per transaction.\r\nIt can now take up to an hour for each transaction to be processed. The fees can go as high as 20 US dollars per transaction.\r\n\"Bitcoin came to be with the goal of becoming a digital alternative to cash. But now we have to honestly say that this experiment has failed,\" says Florian Glatz, President of the German Blockchain Association.\r\n\"Bitcoin has rather become a digital gold. It is valued very highly and it is constantly becoming worth more. And it has become expensive to exchange Bitcoin which all means that people are not moving their Bitcoins anymore. They certainly don't buy coffee with them anymore.\"\r\nOver the past few years, hundreds of alternative cryptocurrencies have entered the market.\r\nSome are similar to Bitcoin, using the same type of Blockchain technology, but each with a twist or improvement which they claim reduces transaction times and fees.\r\nSome are targeted at specific groups, for transactions within an industry or within a geographical area.\r\nSome even use other technologies, moving on from Blockchain technology that some consider too cumbersome, too energy-hungry and not made for large-scale global usage.\r\n\"I think that Bitcoin, in its original form, is better suited as a digital gold. And there is a clear need for that. And there will be another currency for the daily life,\" says Glatz.\r\nBerlin is called the \"capital of Bitcoin\" because of the large number of shops, restaurants and institutions that accept it as payment.\r\nBut it's also a hub for cryptocurrency innovation. Like here at the IOTA foundation office, in the trendy district of Prenzlauer Berg.\r\nIOTA is the technology behind cryptocurrency MIOTA and it's focused on the \"Internet of Things\" - the concept where machines are connected to the internet and communicate with each other.\r\nIOTA doesn't use Blockchain technology. Instead, Schiener and his colleagues have invented a different type of ledger, which they say can scale up as more users start using MIOTA coins.\r\n\r\nFind out more about AP Archive: http://www.aparchive.com/HowWeWork \r\nTwitter: https://twitter.com/AP_Archive \r\nFacebook: https://www.facebook.com/APArchives ​​\r\nInstagram: https://www.instagram.com/APNews/\r\n\r\n\r\nYou can license this story through AP Archive: http://www.aparchive.com/metadata/youtube/9aad207232da51b407315dfca2459fe4"
