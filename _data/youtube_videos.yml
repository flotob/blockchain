        About Guest

        Florian Glatz is the Vice President of the European Crypto Initiative (EUCI) and co-founder of Common Ground (commonground.cg), a novel social network built for web3 communities and DAOs. A visionary at heart, Florian paves the way for self-sovereign identities, community-led decision-making, and a user-owned data economy. Trained as a lawyer and software developer, Florian is an expert on key issues at the intersection of crypto assets and regulation.


        You’ll learn about:
        Prosumers: consumers and producers of content
        How to channel your true fans and establish independent revenue streams
        How Common Ground works to preserve anonymity while limiting bot activity


