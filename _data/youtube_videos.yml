    - title: The Agile Law Firm and the Future of Law -Episode 4
      description: |-
        We were invited to the Legal Edge conferece in Sofia (https://edge.legal) where we saw a range of great speakers discuss Legal Tech.

        Among them was Sascha Theissen, a lawyer with a doctorate degree in Computer Science! He's an absolute visionary when it comes to all things legal tech.

        In this interview, Sascha recounts his story of how he transformed the collaboration of an inhouse legal team at a big firm by introducing Agile methodologies (https://en.wikipedia.org/wiki/Agile_software_development) to the lawyers.

        Beyond that, we discuss the impact of technology on the legal practice of today and tomorrow.

        Follow Sascha on Twitter: https://twitter.com/1digitalnative
