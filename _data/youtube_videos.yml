    - title: 'yWeb3: Navigating Frontier Tech | Snoop Dogg | SilkRoad | Coinbase'
      description: |-
        In this episode, Jay Steinback, CEO & Founder of yWhales, Abe Micael, yWhales Head of Ecosystem, Jeffery Ugbah, Director at Galaxy, and Florian Glatz, Co-Founder of Common Ground discuss the latest in the world of emerging tech and Web3. From hot topics like Elon Musk’s X.ai launch, to Snoop Dogg’s participation in the raise of a Web3 music platform, the team covers deFi, regulation, crypto, gaming, and blockchain news. Listen in for expert insights from the top builders in emerging tech today!




        yWhales Website: https://www.ywhales.com/  
        Podcast Library: https://www.ywhales.com/podcasts 
        YouTube: https://links.ywhales.com/YouTube 
        Vimeo: https://links.ywhales.com/Vimeo 
        LinkedIn: https://links.ywhales.com/LinkedIn 
        Twitter: https://links.ywhales.com/Twitter 
        Medium: https://links.ywhales.com/Medium 


        Guest Social Links:
        Jeffery’s LinkedIn: https://www.linkedin.com/in/jefferyugbah/ 
        Florian’s Twitter: https://twitter.com/heckerhut 
        Florian’s LinkedIn: https://www.linkedin.com/in/florianglatz/ 

        Galaxy’s Website: https://www.galaxy.com/ 
        Common Grounds’ Website: https://www.commonground.cg/ 

         

        About Guests:
        Jeffery Ugbah is a Director within Galaxy Digital’s Investment Banking Practice, where he specializes in gaming, metaverse, and Web3 companies. Jeffery was previously a VP at PJT Partners, where he built out the company’s digital gaming practice and advised interactive entertainment, digital media, and emerging technology companies. Jeffery holds an MBA from the University of Pennsylvania (honors) and A.B. in the History and Philosophy of Science from Harvard College (honors).
        Florian Glatz is Vice President of the European Crypto Initiative (EUCI) and co-founder of Common Ground (commonground.cg), a novel social network built for web3 communities and DAOs. A visionary at heart, Florian paves the way for self-sovereign identities, community-led decision-making and a user-owned data economy. Trained as a lawyer and software developer, Florian is an expert on key issues at the intersection of crypto assets and regulation.


