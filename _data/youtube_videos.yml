    - title: Empowering Creators and Communities in Web3 | Florian Glatz | Common Ground
      description: |-
        In this episode, Mia Murphy, yWhales Co-Founder, and Siva Avvaru, Managing Partner for yWhales Solutions speak with Florian Glatz, Co-founder of Common Ground, an all-in-one communication platform for DAOs & Communities. Florian, Siva, and Mia discuss the growing importance of community building for brands in the Web3 era. Florian discusses why companies need to understand and leverage the power of community building in web3 to be successful today. He shares how Common Ground is helping people, brands, and communities to connect online, emphasizing the need for brands to understand their most active audiences and form meaningful relationships with them. 




