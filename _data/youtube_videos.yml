    - title: ⛵️ - Community-owned Communication Infrastructure - Commonground - Florian Glatz
      description: |-
        Commonground is the caviar of dog-fooding we know we want and somehow keep refusing to chow on. Our collaboration platforms provide some structure, but do not flow into agency. 

        Communities, consciously or not, conspire to keep you captive, in mild reverie and often not so mild strife. This might be related to the structure - not the agent. 

        Florian leads us to conclude that debate is not the point of cooperation. Broadcasting is not dialogue. Convincing is not discovery. The Pearl of Coordination lies hidden while we dive with our mouths open.

        "The atomic unit of coordination" is communication. It stacks up once communities can own their infrastructure, with no super admin. Community hyperstructures achieving coordinated action as a swarm of sovereign collectives will only come once communication is achieved and sustained with a healthy dose of sovereignty. 

        Commonground sets out to fix the platform dilemma by creating web3 enabled high context co-creation space that feels like home to humans independently of their prior "web" experience.
