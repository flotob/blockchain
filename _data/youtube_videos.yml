    - title: 'Florian Glatz: Motion Protocol - echter Use Case für Blockchain Technologie in der Filmindustrie'
      description: |-
        Florian Glatz ist als Rechtsanwalt, Software Entwickler und Unternehmer im Bereich Blockchain tätig. Er ist Mitgründer des Legal Tech Centers und Präsident des Blockchain Bundesverbands. Als Anwalt berät er Blockchain-Startups rund um das Thema Initial Coin Offering. Als Entwickler fokussiert er sich auf innovative Anwendungen der Blockchain im Bereich Law und Finance.

        Am 22. Februar 2019 fand zum dritten Mal die Berlin Legal Tech Conference statt. Die ganztägige Konferenz brachte juristische Vordenker und Innovatoren aus der deutschen, europäischen und internationalen Rechtstechnik zusammen, um die Rechtsdienstleistungsbranche von morgen zu gestalten. Die Veranstaltung lud zu spannenden Vorträgen von wegweisenden Rechtsexperten, anregenden Diskussionen mit gleichgesinnten Kollegen und wertvollen Networking-Möglichkeiten ein.
