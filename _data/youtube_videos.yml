    - title: Experten warnen trotz großer Chancen vor einem Blockchain-Hype
      description: |-
        Das Thema „Blockchain“ stand im Fokus eines öffentlichen Fachgesprächs des Ausschusses für Digitale Agenda des Deutschen Bundestages. Sechs Sachverständige haben den Ausschussmitgliedern Auskunft erteilen. Eine „Blockchain“ (deutsch: Blockkette) ist eine verkettete Folge von Datenblöcken, die über die Zeit weiter fortgeschrieben wird. Die Abgeordneten interessiert, in welchem Zusammenhang sogenannte Distributed-Ledger-Technologien (DLT) das Blockchain-Verfahren und Bitcoin stehen und worin der Unterschied zwischen öffentlichen und privaten Blockchains besteht. 
        Weitere Informationen zu dem thema finden Sie hier:
        https://www.bundestag.de/dokumente/textarchiv/2018/kw48-pa-digitale-agenda/571434
