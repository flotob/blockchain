    - title: E-Euro, Libra, Bitcoin – Wie bezahlen wir in Zukunft?
      description: |-
        Die Blockchain-Technologie ist dabei unser Geldsystem zu revolutionieren. Was vor gut 10 Jahren mit dem Bitcoin begann, beschäftigt längst Zentralbanken und Großkonzerne. Auch die Politik hat das Thema für sich entdeckt und die Spannbreite der politischen Forderungen reicht von Verboten von Kryptowährungen bis hin zu weniger Regulierung.
        Doch wie geht es in Zukunft weiter? Welche Chancen und Risiken bietet die Blockchain-Technologie für unser Geldsystem? Um diese Fragen zu beantworten, bringen die Freien Demokraten Entscheidungsträger aus Wirtschaft, Wissenschaft und Politik zusammen.




        Mit Begrüßungsworten von Christian Dürr MdB, stellv. Fraktionsvorsitzender und einem Impulsvortrag von Prof. Philipp Sandner, Leiter des Frankfurt School Blockchain Center




        Diskutieren Sie anschließend mit:
        • Frank Schäffler MdB, Vorsitzender der AG Finanzen
        • Daniel Szmukler, Director bei der Euro Banking Association
        • Dr. Nina-Luisa Siedler, Anwältin mit Schwerpunkt Blockchain Technologie und Direktorin der INATBA
        • Florian Glatz, Anwalt und Mitgründer des Legal Tech Centers und Präsident des Blockchain Bundesverbands
        • Moderation: Felix Holtermann




        Falls Sie vorab Fragen an uns richten möchten, senden Sie diese bitte an veranstaltungen@fdpbt.de
        mit dem Betreff „Kryptowährungen“.

