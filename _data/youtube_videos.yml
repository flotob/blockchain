    - title: HCPP24 | Florian Glatz - What are we even doing here?
      description: |-
        Crypto was built on a web of trust by like-minded nerds. Today, we don't recognize the field anymore: it's been coopted by lizard-brains and their zero-sum money games. Those not coopted by toxic memes still remember why we started out together. Our mission is not yet fulfilled, the promised land has not yet been reached, all in spite of the positive propaganda eminating from the new "fintech elite".

        Let's remember why we are here and how we can still save the world from itself. I am here to synthesize a new message of hope. To tell a story that wakes up not only us but everyone who can read the signs.

        ▲▲▲

        Florian is a lawyer, author, advocate; builder, coder, and eternal optimist. Currently working on Common Ground, a new attempt at building crypto's missing app layer; and European Crypto Initiative - a think tank for better crypto regulation in EU.

        ▲▲▲

        Hackers Congress Paralelní Polis (HCPP) is the flagship event of Paralelní Polis, which since 2014 has been regularly attended by over 500 fans and IT experts from all over the world. HCPP is held annually in Prague on the first weekend of October. The main thematic pillars of the three-day congress are Freedom & Cryptoanarchy, Decentralized Economics, & Cryptocurrencies, Political Art & Hacking, and Science & Technology.

        ▲▲▲

        Paralelní Polis is a one-­of-­a-­kind nonprofit organization that combines art, social sciences, and modern technologies. The ideas of liberty, independence, innovative thinking, and the development of society are the underlying foundations of the project.

        The project intends to remain state-free as it operates entirely without support from the government. Most of the funds come from the voluntary contributions of our donors and partly from commercial activities such as running a unique co­working space and the world’s first bitcoin-­only cafe.

        It was founded by members of a contemporary-­art group Ztohoven, and Slovak and Czech hacker­spaces. Its main goal is to promote economic, social, and digital freedom. We try to be a vocal voice of freedom in order to shape the public discourse and ultimately work towards a freer future.
