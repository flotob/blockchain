<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florian Glatz | Blockchain Lawyer & Researcher</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --text-light: #6b7280;
            --bg: #ffffff;
            --bg-alt: #f9fafb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-alt) 0%, var(--bg) 100%);
            animation: fadeIn 1s ease-out;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin-bottom: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            animation: fadeIn 1s ease-out 0.2s both;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            animation: fadeIn 1s ease-out 0.4s both;
        }

        .title {
            font-size: 1.5rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .bio {
            max-width: 600px;
            margin: 0 auto 2rem;
            animation: fadeIn 1s ease-out 0.8s both;
        }

        .social {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 2rem;
            animation: fadeIn 1s ease-out 1s both;
        }

        .social a {
            color: var(--text);
            text-decoration: none;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .social a:hover {
            color: var(--primary);
        }

        .button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background-color 0.2s;
            animation: fadeIn 1s ease-out 1.2s both;
        }

        .button:hover {
            background: var(--primary-dark);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            .title {
                font-size: 1.25rem;
            }
            .profile-img {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <main class="hero">
        <div class="container">
            <img src="images/bio-photo.jpg" alt="Florian Glatz" class="profile-img">
            <h1>Florian Glatz</h1>
            <div class="title">Blockchain Lawyer & Researcher</div>
            <p class="bio">
                Exploring the intersection of law and blockchain technology. PhD researcher at University Bayreuth,
                focusing on smart contracts, distributed consensus networks, and algorithmic governance.
