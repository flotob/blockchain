# Site settings
title: "blockchain.lawyer"
description: "Law & Code - Exploring the intersection of blockchain technology and law"
baseurl: ""
url: "https://blockchain.lawyer"
locale: en_US

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# Collections
collections:
  blog_posts:
    output: true
    permalink: /blog/:categories/:title/
  videos:
    output: true
    permalink: /videos/:categories/:title/
  publications:
    output: true
    permalink: /publications/:title/
  research:
    output: true
    permalink: /research/:title/
  slides:
    output: false

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

# Pagination
paginate: 10
paginate_path: "/blog/page:num/"

# Assets
sass:
  sass_dir: _sass
  style: compressed

# SEO
author:
  name: "Florian Glatz"
  avatar: flo3.png
  bio: "Law & Code"
  email: fg@blockchain.lawyer
  social:
    keybase: ftg
    twitter: heckerhut
    github: flotob

# Defaults
defaults:
  - scope:
      path: ""
      type: "blog_posts"
    values:
      layout: "post"
      comments: false
  - scope:
      path: ""
      type: "videos"
    values:
      layout: "video"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "research"
    values:
      layout: "research"

# Exclude from processing
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - Gemfile
  - Gemfile.lock
  - tailwind.config.js
  - postcss.config.js
  - .gitignore
